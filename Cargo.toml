[workspace]
resolver = "2"
members = [
    "src-tauri",
]
default-members = ["src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Navis Team"]
description = "AI-driven desktop development tool"

[workspace.dependencies]
tauri = { version = "2.9", features = ["image-png", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"
parking_lot = "0.12"
arc-swap = "1"
flume = "0.11"
triomphe = "0.1"
