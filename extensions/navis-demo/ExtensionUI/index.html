<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Navis Demo</title>
    <style>
      body { font-family: system-ui; background: #1e1e1e; color: #d4d4d4; padding: 16px; }
      button { margin-top: 8px; padding: 6px 12px; cursor: pointer; }
      #out { margin-top: 12px; white-space: pre-wrap; font-size: 12px; color: #9cdcfe; }
    </style>
  </head>
  <body>
    <h3>Navis Demo Extension</h3>
    <p>这是白板容器的 <code>html:sandbox</code> 视图（<code>ExtensionUI/</code> 目录）。</p>
    <button id="run">执行 demo.echo 受控操作</button>
    <div id="out"></div>
    <script>
      (function () {
        var out = document.getElementById('out');
        var run = document.getElementById('run');
        run.addEventListener('click', function () {
          if (!window.__NAVIS__) {
            out.textContent = '__NAVIS__ bridge unavailable';
            return;
          }
          window.__NAVIS__.invoke('runtime.operation.execute', {
            extensionId: 'navis-demo',
            operationId: 'navis-demo.echo',
            params: { message: 'hello from ExtensionUI' },
          }).then(function (result) {
            out.textContent = JSON.stringify(result, null, 2);
          }).catch(function (error) {
            out.textContent = 'error: ' + error.message;
          });
        });
      })();
    </script>
  </body>
</html>
